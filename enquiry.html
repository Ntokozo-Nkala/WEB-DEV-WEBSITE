<body>

<nav id="mainNav">

<section>
<h2 class="contact-title">Send Us an Enquiry</h2>
<form class="contact-form" id="contactForm" novalidate>
<div class="form-status" id="formStatus"></div><br>
<input type="text" placeholder="Your Name" name="name" id="nameInput" required>
<span class="error-msg" id="nameError"></span>
<input type="email" placeholder="Your Email" name="email" id="emailInput" required>
<span class="error-msg" id="emailError"></span>
<input type="text" placeholder="Subject" name="subject" id="subjectInput" required>
<span class="error-msg" id="subjectError"></span>
<textarea rows="6" placeholder="Your Message" name="message" id="messageInput" required></textarea>
<span class="error-msg" id="messageError"></span><br>
<button type="submit">Send Enquiry</button>
</form>
</section>


<footer>

</footer>
</body>
</html>
